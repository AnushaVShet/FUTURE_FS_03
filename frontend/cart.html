<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Bag | ANVÉRA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">


    <style>

        /* =========================================
           CART PAGE
           ========================================= */

        .cart-page {

            padding: 65px 7% 100px;

            background: #fbf8f1;

            min-height: 75vh;

        }


        .cart-heading {

            text-align: center;

            margin-bottom: 50px;

        }


        .cart-heading .small-heading {

            color: #737a6c;

            margin-bottom: 10px;

        }


        .cart-heading h1 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 58px;

            font-weight: 500;

            color: #394332;

        }


        .cart-layout {

            display: grid;

            grid-template-columns:
                1.5fr .7fr;

            gap: 55px;

            max-width: 1200px;

            margin: auto;

        }


        /* =========================================
           CART ITEMS
           ========================================= */

        .cart-items {

            border-top:
                1px solid #ddd7cc;

        }


        .cart-item {

            display: grid;

            grid-template-columns:
                135px 1fr auto;

            gap: 22px;

            align-items: center;

            padding: 22px 0;

            border-bottom:
                1px solid #ddd7cc;

        }


        .cart-item-image {

            width: 135px;

            height: 165px;

            overflow: hidden;

            background: #e7e0d5;

        }


        .cart-item-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .cart-item-category {

            font-size: 8px;

            letter-spacing: .15em;

            text-transform: uppercase;

            color: #858b80;

            margin-bottom: 7px;

        }


        .cart-item-name {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 24px;

            color: #394332;

            margin-bottom: 7px;

        }


        .cart-item-size {

            font-size: 10px;

            color: #73796e;

            margin-bottom: 15px;

        }


        .cart-item-price {

            font-size: 12px;

            color: #4e5549;

        }


        /* =========================================
           QUANTITY
           ========================================= */

        .cart-quantity {

            display: inline-flex;

            align-items: center;

            border:
                1px solid #c9c3b8;

            margin-top: 15px;

        }


        .cart-quantity button {

            width: 32px;

            height: 32px;

            border: none;

            background: transparent;

            cursor: pointer;

            color: #394332;

            font-size: 15px;

        }


        .cart-quantity span {

            width: 30px;

            text-align: center;

            font-size: 11px;

        }


        /* =========================================
           ITEM RIGHT
           ========================================= */

        .cart-item-right {

            text-align: right;

            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            align-items: flex-end;

        }


        .cart-item-total {

            font-size: 13px;

            color: #394332;

        }


        .remove-item {

            border: none;

            background: none;

            cursor: pointer;

            color: #85897f;

            font-size: 9px;

            letter-spacing: .12em;

            text-transform: uppercase;

            padding: 0;

        }


        .remove-item:hover {

            color: #394332;

        }


        /* =========================================
           SUMMARY
           ========================================= */

        .cart-summary {

            background: #f1ede4;

            padding: 30px;

            height: fit-content;

            position: sticky;

            top: 20px;

        }


        .summary-title {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 30px;

            color: #394332;

            margin-bottom: 25px;

        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 10px 0;

            font-size: 11px;

            color: #686e63;

        }


        .summary-row.total {

            border-top:
                1px solid #d5cec1;

            margin-top: 12px;

            padding-top: 18px;

            font-size: 14px;

            color: #394332;

        }


        .shipping-note {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 16px;

            line-height: 1.4;

            color: #72786d;

            margin: 20px 0;

        }


        .checkout-button {

            display: block;

            width: 100%;

            border: none;

            background: #394332;

            color: white;

            padding: 16px;

            text-align: center;

            text-decoration: none;

            cursor: pointer;

            font-size: 9px;

            letter-spacing: .15em;

            text-transform: uppercase;

        }


        .checkout-button:hover {

            background: #293123;

        }


        .continue-shopping {

            display: block;

            text-align: center;

            margin-top: 17px;

            color: #555c50;

            font-size: 9px;

            letter-spacing: .12em;

            text-transform: uppercase;

            text-decoration: none;

        }


        /* =========================================
           EMPTY BAG
           ========================================= */

        .empty-cart {

            max-width: 650px;

            margin: 20px auto 80px;

            text-align: center;

            padding: 70px 20px;

        }


        .empty-cart-symbol {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 60px;

            color: #9a9f92;

            margin-bottom: 10px;

        }


        .empty-cart h2 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 38px;

            font-weight: 500;

            color: #394332;

            margin-bottom: 10px;

        }


        .empty-cart p {

            color: #747a70;

            font-size: 12px;

            margin-bottom: 25px;

        }


        .shop-button {

            display: inline-block;

            padding: 14px 28px;

            background: #394332;

            color: white;

            text-decoration: none;

            font-size: 9px;

            letter-spacing: .13em;

        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 850px) {

            .cart-layout {

                grid-template-columns: 1fr;

                gap: 35px;

            }


            .cart-summary {

                position: static;

            }

        }


        @media (max-width: 600px) {

            .cart-page {

                padding:
                    45px 5% 70px;

            }


            .cart-heading h1 {

                font-size: 48px;

            }


            .cart-item {

                grid-template-columns:
                    90px 1fr;

                gap: 15px;

            }


            .cart-item-image {

                width: 90px;

                height: 115px;

            }


            .cart-item-right {

                grid-column: 2;

                flex-direction: row;

                align-items: center;

                height: auto;

            }


            .cart-item-name {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- ANNOUNCEMENT -->

    <div class="announcement">

        FREE SHIPPING ON ORDERS ABOVE ₹2,000

        <span> | </span>

        ELEGANT ETHNIC WEAR FOR EVERY YOU

    </div>



    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="brand">

            <span class="brand-symbol">
                ❋
            </span>

            <span class="brand-name">
                ANVÉRA
            </span>

            <small>
                WEAR YOUR STORY
            </small>

        </a>


        <nav class="navigation">

            <a href="index.html">
                HOME
            </a>

            <a href="shop.html">
                SHOP
            </a>

            <a href="index.html#collections">
                COLLECTIONS
            </a>

            <a href="index.html#story">
                ABOUT
            </a>

        </nav>


        <div class="nav-actions">

            <a href="cart.html">

                ♧

                <span id="bagCount">
                    0
                </span>

            </a>

        </div>

    </header>



    <!-- CART -->

    <main class="cart-page">


        <section class="cart-heading">

            <p class="small-heading">
                ANVÉRA / YOUR SELECTION
            </p>

            <h1>
                Your Bag
            </h1>

        </section>



        <!-- CART CONTENT -->

        <div id="cartContent">

            <!-- JavaScript will render this -->

        </div>


    </main>



    <script>

        /* =========================================
           CART DATA
           ========================================= */

        let cart =
            JSON.parse(
                localStorage.getItem(
                    "anveraCart"
                )
            ) || [];


        /* =========================================
           SAVE CART
           ========================================= */

        function saveCart() {

            localStorage.setItem(
                "anveraCart",
                JSON.stringify(cart)
            );

        }


        /* =========================================
           BAG COUNT
           ========================================= */

        function updateBagCount() {

            const bag =
                document.getElementById(
                    "bagCount"
                );


            if (!bag) return;


            const total =
                cart.reduce(
                    (sum, item) =>
                        sum +
                        Number(
                            item.quantity || 1
                        ),
                    0
                );


            bag.textContent =
                total;

        }


        /* =========================================
           IMAGE
           ========================================= */

       
            
                
          function getCartImage(item) {

    if (!item) {
        return "images/kurta.jpg";
    }

    let image = item.imageUrl || "";

    image = String(image)
        .trim()
        .replace(/\\/g, "/");

    if (image !== "") {

        if (
            image.startsWith("http://") ||
            image.startsWith("https://")
        ) {
            return image;
        }

        if (image.startsWith("images/")) {
            return image;
        }

        return "images/" + image;
    }

    const category =
        String(item.category || "").toLowerCase();

    if (category.includes("saree")) {
        return "images/saree.jpg";
    }

    if (category.includes("co-ord")) {
        return "images/coord.jpg";
    }

    if (category.includes("festive")) {
        return "images/festive.jpg";
    }

    return "images/kurta.jpg";
}

        /* =========================================
           RENDER CART
           ========================================= */

        function renderCart() {

            const container =
                document.getElementById(
                    "cartContent"
                );


            updateBagCount();


            if (cart.length === 0) {

                container.innerHTML = `

                    <section class="empty-cart">

                        <div class="empty-cart-symbol">
                            ♧
                        </div>

                        <h2>
                            Your bag is empty
                        </h2>

                        <p>
                            Discover something beautiful
                            from the ANVÉRA collection.
                        </p>

                        <a
                            href="shop.html"
                            class="shop-button"
                        >
                            EXPLORE THE COLLECTION
                        </a>

                    </section>

                `;

                return;

            }


            let subtotal = 0;


            cart.forEach(
                item => {

                    subtotal +=
                        Number(item.price) *
                        Number(
                            item.quantity || 1
                        );

                }
            );


            const shipping =
                subtotal >= 2000
                    ? 0
                    : 99;


            const total =
                subtotal + shipping;


            container.innerHTML = `

                <div class="cart-layout">


                    <!-- ITEMS -->

                    <section class="cart-items">

                        ${cart.map(
                            (item, index) => `

                            <article
                                class="cart-item"
                            >

                                <div
                                    class="cart-item-image"
                                >

                                    <img
                                        src="${getCartImage(item)}"
                                        alt="${escapeHTML(item.name)}"

                                        onerror="
                                            this.src='images/kurta.jpg'
                                        "
                                    >

                                </div>


                                <div
                                    class="cart-item-details"
                                >

                                    <div
                                        class="cart-item-category"
                                    >
                                        ${escapeHTML(
                                            item.category || ""
                                        )}
                                    </div>


                                    <div
                                        class="cart-item-name"
                                    >
                                        ${escapeHTML(
                                            item.name
                                        )}
                                    </div>


                                    ${
                                        item.size
                                        ?

                                        `
                                        <div
                                            class="cart-item-size"
                                        >
                                            SIZE:
                                            ${escapeHTML(
                                                item.size
                                            )}
                                        </div>
                                        `

                                        :

                                        ""

                                    }


                                    <div
                                        class="cart-item-price"
                                    >
                                        ₹${Number(
                                            item.price
                                        ).toLocaleString(
                                            "en-IN"
                                        )}
                                    </div>


                                    <div
                                        class="cart-quantity"
                                    >

                                        <button
                                            onclick="
                                                changeQuantity(
                                                    ${index},
                                                    -1
                                                )
                                            "
                                        >
                                            −
                                        </button>


                                        <span>
                                            ${Number(
                                                item.quantity || 1
                                            )}
                                        </span>


                                        <button
                                            onclick="
                                                changeQuantity(
                                                    ${index},
                                                    1
                                                )
                                            "
                                        >
                                            +
                                        </button>

                                    </div>

                                </div>


                                <div
                                    class="cart-item-right"
                                >

                                    <div
                                        class="cart-item-total"
                                    >

                                        ₹${(
                                            Number(
                                                item.price
                                            ) *
                                            Number(
                                                item.quantity || 1
                                            )
                                        ).toLocaleString(
                                            "en-IN"
                                        )}

                                    </div>


                                    <button
                                        class="remove-item"
                                        onclick="
                                            removeItem(
                                                ${index}
                                            )
                                        "
                                    >
                                        REMOVE
                                    </button>

                                </div>

                            </article>

                        `
                        ).join("")}

                    </section>



                    <!-- SUMMARY -->

                    <aside
                        class="cart-summary"
                    >

                        <h2
                            class="summary-title"
                        >
                            Order Summary
                        </h2>


                        <div
                            class="summary-row"
                        >

                            <span>
                                Subtotal
                            </span>

                            <span>
                                ₹${subtotal.toLocaleString(
                                    "en-IN"
                                )}
                            </span>

                        </div>


                        <div
                            class="summary-row"
                        >

                            <span>
                                Shipping
                            </span>

                            <span>

                                ${
                                    shipping === 0
                                    ? "FREE"
                                    : "₹99"
                                }

                            </span>

                        </div>


                        <div
                            class="summary-row total"
                        >

                            <span>
                                TOTAL
                            </span>

                            <strong>
                                ₹${total.toLocaleString(
                                    "en-IN"
                                )}
                            </strong>

                        </div>


                        <p
                            class="shipping-note"
                        >

                            ${
                                shipping === 0

                                ?

                                "You've unlocked free shipping."

                                :

                                `Add ₹${(
                                    2000 - subtotal
                                ).toLocaleString(
                                    "en-IN"
                                )} more for free shipping.`

                            }

                        </p>


                        <a
                            href="checkout.html"
                            class="checkout-button"
                        >
                            PROCEED TO CHECKOUT
                        </a>


                        <a
                            href="shop.html"
                            class="continue-shopping"
                        >
                            ← CONTINUE SHOPPING
                        </a>

                    </aside>

                </div>

            `;

        }


        /* =========================================
           QUANTITY
           ========================================= */

        function changeQuantity(
            index,
            amount
        ) {

            if (!cart[index]) return;


            cart[index].quantity =
                Number(
                    cart[index].quantity || 1
                ) + amount;


            if (
                cart[index].quantity <= 0
            ) {

                cart.splice(
                    index,
                    1
                );

            }


            saveCart();

            renderCart();

        }


        /* =========================================
           REMOVE
           ========================================= */

        function removeItem(index) {

            if (!cart[index]) return;


            cart.splice(
                index,
                1
            );


            saveCart();

            renderCart();

        }


        /* =========================================
           SECURITY
           ========================================= */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================================
           START
           ========================================= */

        renderCart();

    </script>

</body>

</html>
