<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product | ANVÉRA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">


    <style>

        /* =========================================
           PRODUCT PAGE
           ========================================= */

        .product-page {

            padding: 60px 7% 100px;

            background: #fbf8f1;

        }


        .breadcrumb {

            margin-bottom: 35px;

            font-size: 9px;

            letter-spacing: .12em;

            text-transform: uppercase;

            color: #85897f;

        }


        .breadcrumb a {

            color: #68705f;

            text-decoration: none;

        }


        .product-layout {

            display: grid;

            grid-template-columns:
                1.05fr .95fr;

            gap: 75px;

            max-width: 1250px;

            margin: auto;

        }


        /* IMAGE */

        .product-main-image {

            width: 100%;

            aspect-ratio: .82;

            overflow: hidden;

            background: #e7e0d5;

        }


        .product-main-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        /* DETAILS */

        .product-details {

            padding-top: 25px;

        }


        .product-category {

            font-size: 9px;

            letter-spacing: .17em;

            color: #777d70;

            text-transform: uppercase;

            margin-bottom: 12px;

        }


        .product-title {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 52px;

            line-height: 1.05;

            font-weight: 500;

            color: #394332;

            margin-bottom: 13px;

        }


        .product-price {

            font-size: 16px;

            color: #444a40;

            margin-bottom: 7px;

        }


        .tax-note {

            font-size: 10px;

            color: #85897f;

            margin-bottom: 30px;

        }


        .product-divider {

            border: 0;

            border-top:
                1px solid #ded8cd;

            margin: 25px 0;

        }


        .product-description {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 19px;

            line-height: 1.6;

            color: #62675d;

            margin-bottom: 30px;

        }


        /* SIZE */

        .detail-label {

            font-size: 10px;

            letter-spacing: .13em;

            text-transform: uppercase;

            color: #50574a;

            margin-bottom: 12px;

        }


        .size-options {

            display: flex;

            gap: 8px;

            margin-bottom: 27px;

        }


        .size-button {

            min-width: 48px;

            height: 42px;

            border:
                1px solid #c9c3b8;

            background: transparent;

            color: #4d5448;

            cursor: pointer;

            font-size: 10px;

            transition: .2s;

        }


        .size-button:hover,
        .size-button.selected {

            background: #394332;

            border-color: #394332;

            color: white;

        }


        /* QUANTITY */

        .quantity-row {

            display: flex;

            align-items: center;

            gap: 20px;

            margin-bottom: 20px;

        }


        .quantity-control {

            display: flex;

            align-items: center;

            border:
                1px solid #c9c3b8;

        }


        .quantity-control button {

            width: 38px;

            height: 38px;

            border: none;

            background: transparent;

            color: #394332;

            font-size: 16px;

            cursor: pointer;

        }


        .quantity-control span {

            width: 35px;

            text-align: center;

            font-size: 12px;

        }


        /* BUTTONS */

        .product-actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-bottom: 30px;

        }


        .primary-button,
        .secondary-button {

            padding: 16px 12px;

            cursor: pointer;

            font-size: 9px;

            letter-spacing: .15em;

            text-transform: uppercase;

            transition: .25s;

        }


        .primary-button {

            border:
                1px solid #394332;

            background: #394332;

            color: white;

        }


        .primary-button:hover {

            background: #283021;

        }


        .secondary-button {

            border:
                1px solid #394332;

            background: transparent;

            color: #394332;

        }


        .secondary-button:hover {

            background: #394332;

            color: white;

        }


        .secondary-button:disabled,
        .primary-button:disabled {

            opacity: .45;

            cursor: not-allowed;

        }


        /* INFORMATION */

        .product-information {

            border-top:
                1px solid #ded8cd;

        }


        .info-row {

            border-bottom:
                1px solid #ded8cd;

            padding: 17px 0;

        }


        .info-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            font-size: 10px;

            letter-spacing: .11em;

            text-transform: uppercase;

            color: #4b5245;

        }


        .info-content {

            display: none;

            padding-top: 12px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 17px;

            line-height: 1.5;

            color: #70766b;

        }


        .info-row.open .info-content {

            display: block;

        }


        .info-arrow {

            font-size: 15px;

        }


        /* LOADING */

        .product-loading {

            min-height: 500px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 22px;

            color: #70766b;

        }


        .product-error {

            text-align: center;

            padding: 100px 20px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 22px;

            color: #70766b;

        }


        /* RELATED */

        .related-section {

            margin-top: 100px;

            border-top:
                1px solid #ddd7cb;

            padding-top: 55px;

        }


        .related-heading {

            text-align: center;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 38px;

            font-weight: 500;

            color: #394332;

            margin-bottom: 35px;

        }


        .related-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

        }


        .related-card {

            text-decoration: none;

            color: inherit;

        }


        .related-card-image {

            aspect-ratio: .8;

            overflow: hidden;

            background: #e8e1d6;

        }


        .related-card-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            transition: transform .4s ease;

        }


        .related-card:hover img {

            transform: scale(1.04);

        }


        .related-card-info {

            padding-top: 10px;

        }


        .related-card-name {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 18px;

            color: #394332;

        }


        .related-card-price {

            font-size: 11px;

            color: #6e7469;

            margin-top: 3px;

        }


        @media (max-width: 800px) {

            .product-layout {

                grid-template-columns: 1fr;

                gap: 35px;

            }


            .product-details {

                padding-top: 0;

            }


            .product-title {

                font-size: 43px;

            }


            .related-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 500px) {

            .product-page {

                padding:
                    40px 5% 70px;

            }


            .product-actions {

                grid-template-columns: 1fr;

            }


            .related-grid {

                gap: 25px 10px;

            }

        }

    </style>

</head>


<body>


    <!-- ANNOUNCEMENT -->

    <div class="announcement">

        FREE SHIPPING ON ORDERS ABOVE ₹2,000

        <span> | </span>

        ELEGANT ETHNIC WEAR FOR EVERY YOU

    </div>



    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="brand">

            <span class="brand-symbol">
                ❋
            </span>

            <span class="brand-name">
                ANVÉRA
            </span>

            <small>
                WEAR YOUR STORY
            </small>

        </a>


        <nav class="navigation">

            <a href="index.html">
                HOME
            </a>

            <a href="shop.html">
                SHOP
            </a>

            <a href="index.html#collections">
                COLLECTIONS
            </a>

            <a href="index.html#story">
                ABOUT
            </a>

        </nav>


        <div class="nav-actions">

            <a href="cart.html">

                ♧

                <span id="bagCount">
                    0
                </span>

            </a>

        </div>

    </header>



    <!-- PRODUCT -->

    <main class="product-page">

        <div class="breadcrumb">

            <a href="shop.html">
                SHOP
            </a>

            &nbsp; / &nbsp;

            <span id="breadcrumbProduct">
                PRODUCT
            </span>

        </div>



        <section
            id="productArea"
            class="product-loading"
        >

            Loading product...

        </section>



        <!-- RELATED -->

        <section
            class="related-section"
            id="relatedSection"
            style="display:none;"
        >

            <h2 class="related-heading">
                You May Also Like
            </h2>

            <div
                class="related-grid"
                id="relatedProducts"
            ></div>

        </section>

    </main>



    <script>

        /* =========================================
           CONFIG
           ========================================= */

        const PRODUCT_API =
            "https://futurefs03-production-a9fd.up.railway.app/api/products";


        let product = null;

        let quantity = 1;

        let selectedSize = "";


        /* =========================================
           CART
           ========================================= */

        let productCart =
            JSON.parse(
                localStorage.getItem(
                    "anveraCart"
                )
            ) || [];


        function updateBagCount() {

            const bag =
                document.getElementById(
                    "bagCount"
                );

            if (!bag) return;


            const total =
                productCart.reduce(
                    (sum, item) =>
                        sum +
                        Number(
                            item.quantity || 1
                        ),
                    0
                );


            bag.textContent = total;

        }


        function saveCart() {

            localStorage.setItem(
                "anveraCart",
                JSON.stringify(
                    productCart
                )
            );


            updateBagCount();

        }


        /* =========================================
           GET IMAGE
           ========================================= */

        function getProductImage(item) {

            if (
                item.imageUrl &&
                item.imageUrl.trim() !== ""
            ) {

                return item.imageUrl;

            }


            const category =
                String(
                    item.category || ""
                ).toLowerCase();


            if (
                category.includes("saree")
            ) {

                return "images/saree.jpg";

            }


            if (
                category.includes("co-ord")
            ) {

                return "images/coord.jpg";

            }


            if (
                category.includes("festive")
            ) {

                return "images/festive.jpg";

            }


            return "images/kurta.jpg";

        }


        /* =========================================
           ADD TO BAG
           ========================================= */

        function addToBag() {

            if (!product) return;


            if (
                product.sizes &&
                product.sizes.trim() !== "" &&
                !selectedSize
            ) {

                showMessage(
                    "Please select a size."
                );

                return;

            }


            const existing =
                productCart.find(
                    item =>
                        item.id === product.id &&
                        item.size === selectedSize
                );


            if (existing) {

                existing.quantity += quantity;

            } else {

                productCart.push({

                    id: product.id,

                    name: product.name,

                    category:
                        product.category,

                    price: product.price,

                    imageUrl:
                        product.imageUrl,

                    sizes:
                        product.sizes,

                    size:
                        selectedSize,

                    quantity:
                        quantity

                });

            }


            saveCart();


            showMessage(
                "Added to your bag."
            );

        }


        /* =========================================
           BUY NOW
           ========================================= */

        function buyNow() {

            addToBag();


            setTimeout(
                function () {

                    window.location.href =
                        "cart.html";

                },
                300
            );

        }


        /* =========================================
           QUANTITY
           ========================================= */

        function changeQuantity(amount) {

            quantity += amount;


            if (quantity < 1) {

                quantity = 1;

            }


            if (
                product &&
                product.stock &&
                quantity > product.stock
            ) {

                quantity =
                    product.stock;

            }


            const display =
                document.getElementById(
                    "quantityValue"
                );


            if (display) {

                display.textContent =
                    quantity;

            }

        }


        /* =========================================
           PRODUCT DETAILS
           ========================================= */

        function renderProduct() {

            const area =
                document.getElementById(
                    "productArea"
                );


            if (!product) {

                area.innerHTML = `

                    <div class="product-error">

                        Product not found.

                        <br><br>

                        <a href="shop.html">
                            Return to Shop
                        </a>

                    </div>

                `;

                return;

            }


            document.title =
                `${product.name} | ANVÉRA`;


            document.getElementById(
                "breadcrumbProduct"
            ).textContent =
                product.name;


            const sizes =
                String(
                    product.sizes || ""
                )
                .split(",")
                .map(
                    size =>
                        size.trim()
                )
                .filter(Boolean);


            const isSoldOut =
                Number(product.stock) <= 0;


            area.className =
                "product-layout";


            area.innerHTML = `

                <!-- IMAGE -->

                <div class="product-main-image">

                    <img
                        src="${getProductImage(product)}"
                        alt="${escapeHTML(product.name)}"

                        onerror="
                            this.src='images/kurta.jpg'
                        "
                    >

                </div>



                <!-- DETAILS -->

                <div class="product-details">


                    <div class="product-category">

                        ${escapeHTML(
                            product.category
                        )}

                    </div>


                    <h1 class="product-title">

                        ${escapeHTML(
                            product.name
                        )}

                    </h1>


                    <div class="product-price">

                        ₹${Number(
                            product.price
                        ).toLocaleString(
                            "en-IN"
                        )}

                    </div>


                    <div class="tax-note">

                        Inclusive of applicable taxes

                    </div>


                    <hr class="product-divider">


                    <p class="product-description">

                        ${escapeHTML(
                            product.description ||
                            "A thoughtfully designed ANVÉRA piece, blending contemporary elegance with timeless Indian craftsmanship."
                        )}

                    </p>



                    ${
                        sizes.length > 0
                        ?

                        `

                        <div class="detail-label">

                            SELECT SIZE

                        </div>


                        <div class="size-options">

                            ${sizes.map(
                                size => `

                                    <button
                                        class="size-button"
                                        data-size="${escapeHTML(size)}"
                                    >

                                        ${escapeHTML(size)}

                                    </button>

                                `
                            ).join("")}

                        </div>

                        `

                        : ""

                    }



                    <div class="detail-label">

                        QUANTITY

                    </div>


                    <div class="quantity-row">

                        <div
                            class="quantity-control"
                        >

                            <button
                                id="minusButton"
                            >
                                −
                            </button>


                            <span
                                id="quantityValue"
                            >
                                1
                            </span>


                            <button
                                id="plusButton"
                            >
                                +
                            </button>

                        </div>


                        <span
                            style="
                                font-size:10px;
                                color:#85897f;
                            "
                        >

                            ${
                                isSoldOut
                                ? "Currently unavailable"
                                : `${product.stock} pieces available`
                            }

                        </span>

                    </div>



                    <div class="product-actions">

                        <button
                            class="primary-button"
                            id="addButton"
                            ${isSoldOut ? "disabled" : ""}
                        >

                            ${
                                isSoldOut
                                ? "SOLD OUT"
                                : "ADD TO BAG"
                            }

                        </button>


                        <button
                            class="secondary-button"
                            id="buyButton"
                            ${isSoldOut ? "disabled" : ""}
                        >

                            BUY NOW

                        </button>

                    </div>



                    <div
                        class="product-information"
                    >

                        <div
                            class="info-row"
                        >

                            <div
                                class="info-title"
                            >

                                DESCRIPTION

                                <span class="info-arrow">
                                    +
                                </span>

                            </div>


                            <div
                                class="info-content"
                            >

                                ${escapeHTML(
                                    product.description ||
                                    "Designed for effortless elegance and everyday confidence."
                                )}

                            </div>

                        </div>


                        <div
                            class="info-row"
                        >

                            <div
                                class="info-title"
                            >

                                SIZE & FIT

                                <span class="info-arrow">
                                    +
                                </span>

                            </div>


                            <div
                                class="info-content"
                            >

                                Available sizes:
                                ${
                                    escapeHTML(
                                        product.sizes ||
                                        "One Size"
                                    )
                                }

                                <br><br>

                                Please refer to the
                                product measurements
                                before ordering.

                            </div>

                        </div>


                        <div
                            class="info-row"
                        >

                            <div
                                class="info-title"
                            >

                                DELIVERY & RETURNS

                                <span class="info-arrow">
                                    +
                                </span>

                            </div>


                            <div
                                class="info-content"
                            >

                                Free shipping on orders
                                above ₹2,000.

                                <br><br>

                                Please contact ANVÉRA
                                for return and exchange
                                assistance.

                            </div>

                        </div>

                    </div>


                </div>

            `;


            setupProductEvents();

        }


        /* =========================================
           EVENTS
           ========================================= */

        function setupProductEvents() {


            document
                .querySelectorAll(
                    ".size-button"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            function () {

                                document
                                    .querySelectorAll(
                                        ".size-button"
                                    )
                                    .forEach(
                                        btn =>
                                            btn.classList
                                                .remove(
                                                    "selected"
                                                )
                                    );


                                this.classList.add(
                                    "selected"
                                );


                                selectedSize =
                                    this.dataset.size;

                            }
                        );

                    }
                );


            document
                .getElementById(
                    "minusButton"
                )
                .addEventListener(
                    "click",
                    () =>
                        changeQuantity(-1)
                );


            document
                .getElementById(
                    "plusButton"
                )
                .addEventListener(
                    "click",
                    () =>
                        changeQuantity(1)
                );


            document
                .getElementById(
                    "addButton"
                )
                .addEventListener(
                    "click",
                    addToBag
                );


            document
                .getElementById(
                    "buyButton"
                )
                .addEventListener(
                    "click",
                    buyNow
                );


            document
                .querySelectorAll(
                    ".info-row"
                )
                .forEach(
                    row => {

                        row.addEventListener(
                            "click",
                            function () {

                                this.classList.toggle(
                                    "open"
                                );


                                const arrow =
                                    this.querySelector(
                                        ".info-arrow"
                                    );


                                arrow.textContent =
                                    this.classList.contains(
                                        "open"
                                    )
                                    ? "−"
                                    : "+";

                            }
                        );

                    }
                );

        }


        /* =========================================
           RELATED PRODUCTS
           ========================================= */

        function renderRelatedProducts(
            products
        ) {

            const section =
                document.getElementById(
                    "relatedSection"
                );


            const container =
                document.getElementById(
                    "relatedProducts"
                );


            const related =
                products
                    .filter(
                        item =>
                            item.id !== product.id
                    )
                    .slice(0, 4);


            if (related.length === 0) {

                return;

            }


            section.style.display =
                "block";


            container.innerHTML = "";


            related.forEach(
                item => {

                    const card =
                        document.createElement(
                            "a"
                        );


                    card.className =
                        "related-card";


                    card.href =
                        `product.html?id=${item.id}`;


                    card.innerHTML = `

                        <div
                            class="related-card-image"
                        >

                            <img
                                src="${getProductImage(item)}"
                                alt="${escapeHTML(item.name)}"

                                onerror="
                                    this.src='images/kurta.jpg'
                                "
                            >

                        </div>


                        <div
                            class="related-card-info"
                        >

                            <div
                                class="related-card-name"
                            >

                                ${escapeHTML(
                                    item.name
                                )}

                            </div>


                            <div
                                class="related-card-price"
                            >

                                ₹${Number(
                                    item.price
                                ).toLocaleString(
                                    "en-IN"
                                )}

                            </div>

                        </div>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );

        }


        /* =========================================
           LOAD PRODUCT
           ========================================= */

        async function loadProduct() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const id =
                params.get("id");


            if (!id) {

                document.getElementById(
                    "productArea"
                ).innerHTML = `

                    <div class="product-error">

                        No product selected.

                        <br><br>

                        <a href="shop.html">
                            Browse ANVÉRA Collection
                        </a>

                    </div>

                `;

                return;

            }


            try {

                const response =
                    await fetch(
                        PRODUCT_API
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load products"
                    );

                }


                const products =
                    await response.json();


                product =
                    products.find(
                        item =>
                            String(item.id) ===
                            String(id)
                    );


                renderProduct();


                if (product) {

                    renderRelatedProducts(
                        products
                    );

                }


            } catch (error) {

                console.error(
                    error
                );


                document.getElementById(
                    "productArea"
                ).innerHTML = `

                    <div class="product-error">

                        Unable to load this product.

                        <br><br>

                        Please make sure the
                        Spring Boot backend
                        is running on port 8084.

                    </div>

                `;

            }

        }


        /* =========================================
           SECURITY
           ========================================= */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================================
           MESSAGE
           ========================================= */

        function showMessage(
            message
        ) {

            const old =
                document.getElementById(
                    "productMessage"
                );


            if (old) {

                old.remove();

            }


            const box =
                document.createElement(
                    "div"
                );


            box.id =
                "productMessage";


            box.textContent =
                message;


            box.style.position =
                "fixed";

            box.style.right =
                "25px";

            box.style.bottom =
                "25px";

            box.style.background =
                "#394332";

            box.style.color =
                "#fff";

            box.style.padding =
                "14px 22px";

            box.style.fontSize =
                "11px";

            box.style.zIndex =
                "9999";


            document.body.appendChild(
                box
            );


            setTimeout(
                () =>
                    box.remove(),
                2200
            );

        }


        /* =========================================
           START
           ========================================= */

        updateBagCount();

        loadProduct();

    </script>

</body>

</html>
